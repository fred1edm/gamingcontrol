[package]
name = "gaming-control"
version = "0.1.0"
description = "Aplicación de escritorio para Gaming Control"
authors = ["Gorilaz Gamer"]
edition = "2021"

[lib]
name = "gaming_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
