services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaming_control
      POSTGRES_USER: gaming
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaming -d gaming_control"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
